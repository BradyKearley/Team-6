; Cell tower firmware: classic ESP32 (WROOM-32) broadcasting ESP-NOW beacons.
; Build one env per physical tower:  pio run -e tower_a -t upload

[platformio]
default_envs = tower_a, tower_b, tower_c, tower_d

[env]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../common
    -DCHANNEL=1          ; WiFi channel, must match the plane
    -DBEACON_PERIOD_MS=50
    -DLED_PIN=2          ; on-board blue LED on most DevKit boards

[env:tower_a]
build_flags = ${env.build_flags} -DTOWER_NAME=\"A\"

[env:tower_b]
build_flags = ${env.build_flags} -DTOWER_NAME=\"B\"

[env:tower_c]
build_flags = ${env.build_flags} -DTOWER_NAME=\"C\"

[env:tower_d]
build_flags = ${env.build_flags} -DTOWER_NAME=\"D\"

; Towers on ESP32-C3 boards (native USB, LED on GPIO8). Flash with e.g.:
;   pio run -e tower_c_c3 -t upload
; The C3 antenna differs from the WROOM towers, so calibrate RSSI@1m for these separately.
; TX power is 8.5 dBm (34 quarter-dBm), not max: cheap C3 boards overheat and their
; antenna/PA distorts at max power (tower D only reached a few meters at 21 dBm).
; CPU at 80 MHz (plenty for beaconing) and active-low LED also cut heat.
[c3]
board = esp32-c3-devkitm-1
board_build.f_cpu = 80000000L
build_flags =
    -I ../common
    -DCHANNEL=1
    -DBEACON_PERIOD_MS=50
    -DLED_PIN=8
    -DLED_ON=LOW
    -DTX_POWER_QDBM=34
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:tower_c_c3]
board = ${c3.board}
board_build.f_cpu = ${c3.board_build.f_cpu}
build_flags = ${c3.build_flags} -DTOWER_NAME=\"C\"

[env:tower_d_c3]
board = ${c3.board}
board_build.f_cpu = ${c3.board_build.f_cpu}
build_flags = ${c3.build_flags} -DTOWER_NAME=\"D\"

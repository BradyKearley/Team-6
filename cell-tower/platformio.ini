; Cell tower firmware: classic ESP32 (WROOM-32) broadcasting ESP-NOW beacons.
; Build one env per physical tower:  pio run -e tower_a -t upload

[platformio]
default_envs = tower_a, tower_b, tower_c, tower_d

[env]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../common
    -DCHANNEL=1          ; WiFi channel, must match the plane
    -DBEACON_PERIOD_MS=50
    -DLED_PIN=2          ; on-board blue LED on most DevKit boards

[env:tower_a]
build_flags = ${env.build_flags} -DTOWER_NAME=\"A\"

[env:tower_b]
build_flags = ${env.build_flags} -DTOWER_NAME=\"B\"

[env:tower_c]
build_flags = ${env.build_flags} -DTOWER_NAME=\"C\"

[env:tower_d]
build_flags = ${env.build_flags} -DTOWER_NAME=\"D\"

; Plane firmware: Heltec WiFi LoRa 32 V3.2 (ESP32-S3).
; Sniffs tower beacons, estimates distances, reports over BLE + USB serial.
;   pio run -t upload && pio device monitor

[env:heltec_wifi_lora_32_V3]
platform = espressif32@^6
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.2.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_flags =
    -I ../common
    -DCHANNEL=1             ; WiFi channel, must match the towers
    -DRSSI_AT_1M=-45.0f     ; calibration: filtered RSSI at 1 m from a tower
    -DPATH_LOSS_N=2.5f      ; calibration: path-loss exponent (2 free space, 2.5-4 indoors)
    -DREPORT_PERIOD_MS=200
